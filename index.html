<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>2026 하이케어솔루션 매니저 경진대회</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --lg:#A50034; --lg2:#C8003F; --lgdark:#7A0026; --lgsoft:#F9E6EC;
  --bg:#F4F4F4; --bg2:#FFFFFF; --card:#FFFFFF; --line:#E1E1E1;
  --text:#1F1F1F; --muted:#6B6B6B; --gray:#A0A0A0;
  --ok:#1E8E3E; --bad:#D6002F; --warn:#E07A00;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);overflow:hidden;user-select:none;-webkit-user-select:none}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:8px;background:var(--lg);z-index:100}
button{font-family:inherit;cursor:pointer;border:none;touch-action:manipulation}
input,select,textarea{font-family:inherit;user-select:text;-webkit-user-select:text}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
.hidden{display:none!important}

/* ---------- Top bar ---------- */
.topbar{position:fixed;top:8px;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:22px 28px;z-index:10}
.btn-quiz{background:#fff;color:var(--lg);border:3px solid var(--lg);font-size:22px;font-weight:700;padding:16px 28px;border-radius:16px;box-shadow:0 6px 18px rgba(165,0,52,.12);display:flex;align-items:center;gap:10px}
.btn-quiz:active{transform:scale(.97);background:var(--lgsoft)}
.btn-quiz:disabled{border-color:var(--line);color:var(--gray);box-shadow:none;cursor:not-allowed;background:#fafafa}
.top-right{display:flex;gap:10px;margin-left:auto}
.main-btns{display:flex;justify-content:center;align-items:center}
.main-btns > button{width:400px;height:120px;border-radius:28px;font-size:36px;font-weight:900;margin:0 16px;padding:0;justify-content:center}
.main-btns .btn-quiz{border-width:4px;background:#fff}
.icon-btn{width:52px;height:52px;border-radius:14px;background:#fff;border:1px solid var(--line);color:var(--muted);font-size:22px;display:flex;align-items:center;justify-content:center}
.icon-btn:active{background:#eee}

/* ---------- Main ---------- */
.screen{position:fixed;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:110px 24px 40px;text-align:center}
.badge{display:inline-block;padding:8px 18px;border-radius:999px;background:var(--lgsoft);color:var(--lg);font-weight:700;letter-spacing:.08em;font-size:16px;margin-bottom:18px}
.title{font-size:72px;font-weight:900;line-height:1.15;letter-spacing:-.02em;color:var(--text)}
.title em{font-style:normal;color:var(--lg)}
.subtitle{color:var(--muted);font-size:38px;font-weight:500;margin-top:16px}
.name-input{margin-top:28px;background:#fff;border:2px solid var(--line);color:var(--text);font-size:22px;padding:14px 22px;border-radius:14px;width:min(420px,90vw);text-align:center;outline:none}
.name-input:focus{border-color:var(--lg)}
.name-input:disabled{background:#f7f7f7;color:var(--muted)}
.timer{font-size:190px;font-weight:700;margin:26px 0 8px;letter-spacing:-.03em;line-height:1;color:#3a3a3a}
.timer .cs{font-size:.45em;color:var(--gray)}
.timer.running{color:var(--lg)}
.status-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:26px;min-height:40px}
.chip{padding:8px 16px;border-radius:999px;background:#EBEBEB;color:var(--muted);font-size:17px;font-weight:500}
.chip.done{background:#E6F4EA;color:var(--ok)}
.chip.live{background:var(--lgsoft);color:var(--lg)}
.btn-start{width:min(360px,80vw);height:120px;border-radius:28px;font-size:36px;font-weight:900;color:#fff;background:var(--lg);box-shadow:0 14px 36px rgba(165,0,52,.35);animation:pulse 2s infinite}
.btn-start:active{transform:scale(.97);background:var(--lgdark)}
@keyframes pulse{0%,100%{box-shadow:0 14px 36px rgba(165,0,52,.30)}50%{box-shadow:0 14px 56px rgba(165,0,52,.55)}}
.btn-submit{width:min(360px,80vw);height:100px;border-radius:24px;font-size:32px;font-weight:900;color:#fff;background:#3a3a3a;box-shadow:0 12px 30px rgba(0,0,0,.2)}
.btn-submit:active{transform:scale(.97);background:#1f1f1f}

/* ---------- Quiz overlay ---------- */
.quiz{position:fixed;top:0;right:0;bottom:0;left:0;background:var(--bg);z-index:30;display:flex;flex-direction:column;padding:32px 32px 32px}
.quiz::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:var(--lg)}
.quiz-head{display:flex;justify-content:space-between;align-items:center;gap:20px}
.quiz-count{font-size:24px;font-weight:700;color:var(--muted)}
.quiz-count b{color:var(--lg);font-size:32px}
.quiz-clock{font-size:64px;font-weight:700;color:var(--text)}
.quiz-clock.warn{color:var(--warn)}
.quiz-clock.danger{color:var(--lg);animation:blink .5s infinite alternate}
@keyframes blink{to{opacity:.4}}
.quiz-main-timer{display:flex;align-items:center;background:#fff;border:3px solid var(--lg);border-radius:20px;padding:8px 30px;box-shadow:0 8px 24px rgba(165,0,52,.15)}
.quiz-main-timer .lbl{font-size:24px;font-weight:700;color:var(--muted);margin-right:20px}
.quiz-main-timer .mono{font-size:64px;font-weight:700;color:var(--lg);line-height:1.1}
.bar{height:4px;background:var(--lg);border-radius:99px;margin:20px 0 20px;opacity:.15}
.bar > i{display:block;height:100%;background:var(--lg);transition:width .1s linear}
.dots{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
.dots span{width:14px;height:14px;border-radius:50%;background:#D5D5D5}
.dots span.cur{background:var(--lg);transform:scale(1.25)}
.dots span.ans{background:#D98AA3}
.q-text{flex:0 0 auto;font-size:46px;font-weight:700;line-height:1.4;text-align:center;padding:10px 20px 28px;min-height:140px;display:flex;align-items:center;justify-content:center;word-break:keep-all}
.quiz-body{flex:1;display:flex;min-height:0}
.quiz-left{flex:1;display:flex;flex-direction:column;min-width:0}
.quiz-side{width:320px;margin-left:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:0 8px 24px rgba(0,0,0,.05)}
.qs-label{font-size:26px;font-weight:700;color:var(--muted);margin-bottom:16px}
.qs-unit{font-size:24px;color:var(--muted);margin-top:14px}
.ring{position:relative;width:240px;height:240px}
.ring svg{width:240px;height:240px;-webkit-transform:rotate(-90deg);transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:18}
.ring-bg{stroke:#EEE}
.ring-fg{stroke:var(--text);stroke-linecap:round;stroke-dasharray:653.45;stroke-dashoffset:0;-webkit-transition:stroke-dashoffset .1s linear;transition:stroke-dashoffset .1s linear}
.ring-num{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:100px;font-weight:700;color:var(--text)}
.ring.warn .ring-fg{stroke:var(--warn)} .ring.warn .ring-num{color:var(--warn)}
.ring.danger .ring-fg{stroke:var(--lg)} .ring.danger .ring-num{color:var(--lg);-webkit-animation:blink .5s infinite alternate;animation:blink .5s infinite alternate}
.ring.tick .ring-num{-webkit-animation:tickpulse .5s;animation:tickpulse .5s}
.opts{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:18px;max-height:none}
.opt{background:#fff;border:3px solid var(--line);border-radius:22px;color:var(--text);font-size:32px;font-weight:500;padding:18px 24px;display:flex;align-items:center;gap:18px;text-align:left;word-break:keep-all;transition:transform .08s;box-shadow:0 4px 12px rgba(0,0,0,.04)}
.opt:active{transform:scale(.98)}
.opt .n{flex:0 0 auto;width:52px;height:52px;border-radius:50%;background:#F0F0F0;color:var(--muted);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:24px}
.opt.sel{border-color:var(--lg);background:var(--lgsoft)}
.opt.sel .n{background:var(--lg);color:#fff}
.opts.ox .opt{justify-content:center;font-size:120px;font-weight:900}
.opts.ox .opt .n{display:none}
.opts.ox .opt:first-child{color:#1565C0}
.opts.ox .opt:last-child{color:var(--lg)}
.opts.locked .opt{opacity:.35;pointer-events:none}

/* ---------- Result ---------- */
.result-label{color:var(--muted);font-size:22px;font-weight:500;margin-bottom:6px}
.result-grid{display:flex;gap:28px;flex-wrap:wrap;justify-content:center;margin:30px 0}
.r-card{background:#fff;border:1px solid var(--line);border-radius:28px;padding:30px 48px;min-width:320px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
.r-card .v{font-size:110px;font-weight:700;line-height:1.1;color:#3a3a3a}
.r-card .v small{font-size:.4em;color:var(--gray)}
.r-card.score{border:3px solid var(--lg)}
.r-card.score .v{color:var(--lg)}
.review{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:900px;margin-bottom:20px}
.review div{width:64px;padding:8px 0;border-radius:12px;font-weight:700;font-size:16px}
.review .o{background:#E6F4EA;color:var(--ok)}
.review .x{background:var(--lgsoft);color:var(--lg)}
.btn-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.btn-big{min-width:280px;height:88px;border-radius:22px;font-size:28px;font-weight:900;color:#fff;background:var(--lg);margin-top:14px;padding:0 30px}
.btn-big:active{background:var(--lgdark)}
.btn-big.yellow{background:#3a3a3a}
.btn-big.ghost{background:#fff;color:var(--text);border:2px solid var(--line)}

/* ---------- Who inputs ---------- */
.who{display:flex;justify-content:center;margin-top:28px}
.who .name-input{margin:0 8px;width:340px}

/* ---------- Result + Ranking ---------- */
#scrResult{flex-direction:row;align-items:stretch;justify-content:center;padding:120px 60px 50px}
.res-left{width:620px;display:flex;flex-direction:column;align-items:center;justify-content:center;margin-right:50px}
.res-left .title{font-size:56px}
.res-dept{font-size:26px;color:var(--muted);margin-top:6px;font-weight:500}
.res-left .r-card{width:100%;margin:10px 0;padding:22px 30px}
.res-left .r-card .v{font-size:92px}
.res-left .btn-row{margin-top:10px}
.res-left .btn-big{min-width:250px;height:80px;font-size:26px}
.rank-panel{flex:1;max-width:1100px;background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:0 10px 30px rgba(0,0,0,.06);padding:26px 32px;display:flex;flex-direction:column}
.rank-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px;border-bottom:3px solid var(--lg);padding-bottom:12px}
.rank-head h2{font-size:38px;font-weight:900}
.rank-head span{font-size:22px;color:var(--muted)}
.rank-cols{display:flex;padding:0 20px 8px;color:var(--gray);font-size:18px;font-weight:700}
.board{position:relative;flex:1}
.rrow{position:absolute;left:0;right:0;height:56px;display:flex;align-items:center;padding:0 20px;border-radius:14px;background:#FAFAFA;border:1px solid #EEE;font-size:26px;-webkit-transition:top .38s cubic-bezier(.3,.9,.4,1.2),background .3s;transition:top .38s cubic-bezier(.3,.9,.4,1.2),background .3s}
.c-rank{width:90px;font-weight:900;font-size:28px;color:var(--muted)}
.c-name{flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-dept{width:260px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-score{width:130px;text-align:center;font-weight:700}
.c-time{width:190px;text-align:right}
.rank-cols .c-rank,.rank-cols .c-score{font-size:18px;color:var(--gray)}
.rrow.g1 .c-rank{color:#C9A000}.rrow.g2 .c-rank{color:#8A8A8A}.rrow.g3 .c-rank{color:#B0652B}
.rrow.me{background:var(--lg);border-color:var(--lg);color:#fff;z-index:5;box-shadow:0 10px 30px rgba(165,0,52,.35);-webkit-transform:scale(1.03);transform:scale(1.03)}
.rrow.me .c-rank,.rrow.me .c-dept{color:#fff}
.rrow.me.moving{-webkit-animation:shake .38s;animation:shake .38s}
.rrow.me.landed{-webkit-animation:land 1s ease-out 3;animation:land 1s ease-out 3}
.rrow.gap{background:none;border:none;justify-content:center;color:var(--gray);font-size:30px;letter-spacing:.3em}
@keyframes shake{0%{transform:scale(1.03)}50%{transform:scale(1.08)}100%{transform:scale(1.03)}}
@keyframes land{0%{box-shadow:0 0 0 0 rgba(165,0,52,.6)}100%{box-shadow:0 0 0 26px rgba(165,0,52,0)}}
.rank-msg{text-align:center;font-size:30px;font-weight:900;color:var(--lg);min-height:44px;margin-top:10px;opacity:0;-webkit-transition:opacity .4s;transition:opacity .4s}
.rank-msg.show{opacity:1}
.quiz-clock.tick{-webkit-animation:tickpulse .5s;animation:tickpulse .5s}
@keyframes tickpulse{0%{transform:scale(1.25)}100%{transform:scale(1)}}

/* ---------- Modal ---------- */
.modal-bg{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-top:8px solid var(--lg);border-radius:24px;padding:36px;max-width:560px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h3{font-size:30px;margin-bottom:12px}
.modal p{color:var(--muted);font-size:20px;line-height:1.6}
.modal .btn-row{margin-top:26px}
.modal .btn-big{min-width:180px;height:72px;font-size:24px}
.pin{font-size:34px;letter-spacing:.4em;text-align:center;width:220px;padding:12px;border-radius:14px;border:2px solid var(--line);background:#fafafa;color:var(--text);margin-top:16px;outline:none}
.pin:focus{border-color:var(--lg)}

/* ---------- Admin ---------- */
.admin{position:fixed;top:0;right:0;bottom:0;left:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;user-select:text;-webkit-user-select:text}
.admin-head{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;background:var(--lg);color:#fff}
.admin-head h2{font-size:22px}
.admin-head .sbtn{background:rgba(255,255,255,.15);border-color:transparent;color:#fff}
.tabs{display:flex;gap:6px;padding:12px 24px 0;border-bottom:1px solid var(--line);background:#fff}
.tab{background:none;color:var(--muted);font-size:17px;font-weight:700;padding:12px 18px;border-bottom:3px solid transparent}
.tab.on{color:var(--lg);border-color:var(--lg)}
.admin-body{flex:1;overflow:auto;padding:22px 24px 60px}
.sbtn{background:#fff;color:var(--text);border:1px solid var(--line);padding:10px 16px;border-radius:10px;font-size:15px;font-weight:500}
.sbtn.pri{background:var(--lg);border-color:var(--lg);color:#fff}
.sbtn.blue{background:#3a3a3a;border-color:#3a3a3a;color:#fff}
.sbtn.danger{color:var(--bad)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.help{background:#fff;border:1px solid var(--line);border-left:5px solid var(--lg);border-radius:14px;padding:16px 18px;color:var(--muted);font-size:14.5px;line-height:1.75;margin-bottom:18px}
.help b{color:var(--text)}
.help code{background:var(--lgsoft);padding:1px 6px;border-radius:5px;color:var(--lg)}
.q-item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.q-item .row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.q-item .num{font-weight:900;color:var(--lg);width:34px;flex:0 0 auto}
.q-item input[type=text],.field input,.field select{flex:1;background:#fafafa;border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:9px;font-size:15px;outline:none;min-width:0}
.q-item input:focus,.field input:focus{border-color:var(--lg)}
.q-item .opts-edit{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-left:42px}
.q-item .opts-edit label{display:flex;gap:6px;align-items:center}
.q-item .opts-edit input[type=radio]{width:20px;height:20px;accent-color:var(--lg)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:18px;max-width:520px}
.field > span{font-weight:700;font-size:15px}
.field small{color:var(--muted)}
.field label.ck{display:flex;gap:8px;align-items:center;font-weight:500}
.field input[type=checkbox]{accent-color:var(--lg);width:18px;height:18px}
table{width:100%;border-collapse:collapse;font-size:15px;background:#fff}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:500;background:#fafafa}
.toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);background:#1f1f1f;color:#fff;padding:14px 24px;border-radius:12px;font-weight:700;font-size:18px;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.3)}
@media (max-width:760px){
  .q-item .opts-edit{grid-template-columns:1fr;padding-left:0}
}

/* ---------- Stage (fixed 1920x1080, scaled to screen) ---------- */
#stage{background:linear-gradient(180deg,#FFFFFF 0%,var(--bg) 100%);position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;-webkit-transform-origin:0 0;transform-origin:0 0}
#stage .screen,#stage .quiz,#stage .modal-bg,#stage .topbar{position:absolute}
#stage .toast{position:absolute}
body::before{display:none}
#stage::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:var(--lg);z-index:100}
.top-right .icon-btn{margin-left:10px}
.status-row .chip{margin:0 6px}
.btn-row > *{margin-left:7px;margin-right:7px}
.result-grid .r-card{margin:0 14px}
.dots span{margin:0 4px}
.opt .n{margin-right:18px}
.review div{margin:5px}
</style>
</head>
<body>

<div id="stage">
<!-- Top bar -->
<div class="topbar">
  <div class="top-right">
    <button class="icon-btn" id="btnSound" onclick="toggleSound()" title="효과음">🔊</button>
    <button class="icon-btn" onclick="toggleFS()" title="전체화면">⛶</button>
    <button class="icon-btn" onclick="openPin()" title="관리자">⚙</button>
  </div>
</div>

<!-- Main screen -->
<section class="screen" id="scrMain">
  <div class="badge">TIME ATTACK</div>
  <h1 class="title" id="mainTitle">2026년 <em>하이케어솔루션</em><br>매니저 경진대회</h1>
  <p class="subtitle" id="mainSub">가장 빠르고 정확한 매니저에 도전하세요!</p>
  <div class="who">
    <input class="name-input" id="deptInput" placeholder="소속" maxlength="30">
    <input class="name-input" id="nameInput" placeholder="이름" maxlength="20">
  </div>
  <div class="timer mono" id="mainTimer">00:00<span class="cs">.00</span></div>
  <div class="status-row" id="statusRow"></div>
  <div class="main-btns">
    <button class="btn-start" id="btnStart" onclick="startMain()">▶ 타이머 시작</button>
    <button class="btn-submit hidden" id="btnSubmit" onclick="askSubmit()">✔ 최종 제출</button>
    <button class="btn-quiz" id="btnQuiz" onclick="startQuiz()">📝 퀴즈 풀이 시작</button>
  </div>
</section>

<!-- Result screen -->
<section class="screen hidden" id="scrResult">
  <div class="res-left">
    <div class="badge">RESULT</div>
    <h1 class="title" id="resName">경기 종료</h1>
    <div class="res-dept" id="resDept"></div>
    <div style="height:18px"></div>
    <div class="r-card"><div class="result-label">⏱ 최종 기록</div><div class="v mono" id="resTime">00:00.00</div></div>
    <div class="r-card score"><div class="result-label">📝 퀴즈 점수</div><div class="v mono" id="resScore">0<small> / 10</small></div></div>
    <div class="review hidden" id="resReview"></div>
    <div class="btn-row">
      <button class="btn-big ghost" onclick="toggleReview()">정답 확인</button>
      <button class="btn-big" onclick="resetAll()">다음 참가자 ▶</button>
    </div>
  </div>
  <div class="rank-panel">
    <div class="rank-head"><h2>🏆 전체 순위</h2><span id="rankTotal"></span></div>
    <div class="rank-cols"><span class="c-rank">순위</span><span class="c-name">이름</span><span class="c-dept">소속</span><span class="c-score">점수</span><span class="c-time">기록</span></div>
    <div class="board" id="board"></div>
    <div class="rank-msg" id="rankMsg"></div>
  </div>
</section>

<script>
/* ================= Compat ================= */
function pad2(n){ n=String(n); return n.length<2?'0'+n:n; }
/* ================= Storage ================= */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

const DEFAULT_QUESTIONS = [
  {q:"하이케어솔루션은 어느 기업의 케어솔루션 생태계에서 서비스를 제공하나요?", o:["삼성전자","LG전자","SK매직","코웨이"], a:1},
  {q:"정기 방문 시 고객 댁에 들어가기 전 가장 먼저 해야 할 행동은?", o:["바로 제품 점검","인사 및 방문 목적 안내","계약서 작성","사진 촬영"], a:1},
  {q:"정수기 필터는 교체 주기와 관계없이 고객이 원할 때만 교체한다.", o:["O","X"], a:1},
  {q:"고객 불만 응대 시 가장 먼저 해야 할 것은?", o:["변명하기","경청과 공감","상사 연결","규정 설명"], a:1},
  {q:"방문 후 작업 완료 보고는 언제 하는 것이 가장 바람직한가요?", o:["다음 날","일주일 후","방문 직후","월말"], a:2},
  {q:"케어 서비스 중 고객의 개인정보는 동의 없이 제3자에게 공유할 수 있다.", o:["O","X"], a:1},
  {q:"공기청정기 관리 시 주로 점검하는 부품은?", o:["필터","냉매","드럼","노즐"], a:0},
  {q:"방문 시 실내화(덧신) 착용은 고객 배려의 기본 매너이다.", o:["O","X"], a:0},
  {q:"구독 서비스의 장점으로 가장 거리가 먼 것은?", o:["초기 비용 부담 완화","정기 전문 관리","소유권 즉시 이전","사후관리 편의"], a:2},
  {q:"서비스 종료 시 고객에게 안내해야 할 내용으로 적절한 것은?", o:["다음 방문 일정","경쟁사 제품","개인 연락처만","없음"], a:0}
];
const DEFAULT_SETTINGS = {
  title:"2026년 하이케어솔루션\n매니저 경진대회",
  sub:"가장 빠르고 정확한 매니저에 도전하세요!",
  quizSec:60, qSec:30, quizCount:10, shuffle:false, shuffleOpts:false, pin:"1234",
  confirmSubmit:true, sound:true
};

let questions = LS.get('hc_questions', DEFAULT_QUESTIONS);
let settings  = Object.assign({}, DEFAULT_SETTINGS, LS.get('hc_settings', {}));
let records   = LS.get('hc_records', []);
records.forEach(function(r,i){ if(!r.id) r.id = 'r'+Date.now()+'_'+i; if(r.dept==null) r.dept=''; });
function sortRecords(list){ return list.slice().sort(function(a,b){ return (b.score-a.score) || (a.time-b.time); }); }

/* ================= Sound (Web Audio, no files) ================= */
var AC = null;
function audio(){
  if (!settings.sound) return null;
  try{
    if (!AC){ var C = window.AudioContext || window.webkitAudioContext; if(!C) return null; AC = new C(); }
    if (AC.state === 'suspended' && AC.resume) AC.resume();
  }catch(e){ return null; }
  return AC;
}
function tone(freq, dur, type, vol, delay, slideTo){
  var ac = audio(); if(!ac) return;
  try{
    var t = ac.currentTime + (delay||0);
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t+dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol||0.3, t+0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t+dur+0.02);
  }catch(e){}
}
var SFX = {
  tick:function(){ tone(1900,0.045,'square',0.22); tone(3800,0.02,'sine',0.08); },   // 똑
  tock:function(){ tone(1150,0.06,'square',0.22); tone(2300,0.025,'sine',0.08); },   // 딱
  buzzer:function(){ tone(160,0.7,'sawtooth',0.28); tone(163,0.7,'square',0.12); },
  start:function(){ tone(660,0.12,'triangle',0.3); tone(990,0.25,'triangle',0.3,0.12); },
  submit:function(){ tone(520,0.1,'triangle',0.3); tone(780,0.18,'triangle',0.3,0.1); },
  swap:function(n){ var f = 420 + Math.min(n,20)*45; tone(f,0.13,'triangle',0.3,0,f*1.6); tone(f*2,0.06,'sine',0.08,0.02); },
  whoosh:function(){ tone(300,0.35,'sawtooth',0.08,0,1200); },
  fanfare:function(top){
    var n = top ? [523,659,784,1047,784,1047] : [523,659,784,1047];
    var d = top ? [0,.12,.24,.36,.52,.64] : [0,.11,.22,.33];
    for (var i=0;i<n.length;i++) tone(n[i], i===n.length-1?0.7:0.16, 'triangle', 0.32, d[i]);
    if (top){ tone(1319,0.8,'sine',0.15,0.64); tone(1568,0.8,'sine',0.12,0.64); }
  }
};
function toggleSound(){
  settings.sound = !settings.sound; LS.set('hc_settings', settings);
  updateSoundBtn(); if (settings.sound) SFX.start();
  toast(settings.sound ? '🔊 효과음 켜짐' : '🔇 효과음 꺼짐');
}
function updateSoundBtn(){ $('btnSound').textContent = settings.sound ? '🔊' : '🔇'; }

/* ================= State ================= */
const S = {
  running:false, startAt:0, elapsed:0, raf:null,
  quizState:'none', // none | live | done
  quizSet:[], quizIdx:0, answers:[], quizStart:0, quizTimer:null
};

const $ = id => document.getElementById(id);

function fmt(ms){
  const t = Math.max(0, ms);
  const m = Math.floor(t/60000), s = Math.floor(t%60000/1000), cs = Math.floor(t%1000/10);
  const h = Math.floor(m/60);
  const mm = h ? `${h}:${pad2(m%60)}` : pad2(m);
  return {main:`${mm}:${pad2(s)}`, cs:`.${pad2(cs)}`};
}
function fmtStr(ms){ const f = fmt(ms); return f.main + f.cs; }

function applyTexts(){
  const t = settings.title.replace(/</g,'&lt;');
  const lines = t.split('\n');
  $('mainTitle').innerHTML = lines.map(l => l.replace('하이케어솔루션','<em>하이케어솔루션</em>')).join('<br>');
  $('mainSub').textContent = settings.sub;
  document.title = settings.title.replace(/\n/g,' ');
}

/* ================= Main timer ================= */
function startMain(){
  if (S.running) return;
  S.running = true;
  S.startAt = performance.now();
  $('mainTimer').classList.add('running');
  $('btnStart').classList.add('hidden');
  $('btnSubmit').classList.remove('hidden');
  $('nameInput').disabled = true; $('deptInput').disabled = true;
  SFX.start();
  tick();
  renderStatus();
  requestWakeLock();
}
function tick(){
  if (!S.running) return;
  S.elapsed = performance.now() - S.startAt;
  const f = fmt(S.elapsed);
  $('mainTimer').innerHTML = `${f.main}<span class="cs">${f.cs}</span>`;
  $('qMainTimer').textContent = f.main + f.cs;
  S.raf = requestAnimationFrame(tick);
}
function stopMain(){
  if (!S.running) return;
  S.elapsed = performance.now() - S.startAt;
  S.running = false;
  cancelAnimationFrame(S.raf);
}
function renderStatus(){
  const row = $('statusRow');
  if (!S.running && S.quizState==='none'){ row.innerHTML=''; return; }
  let chip = '';
  if (S.quizState==='none') chip = `<span class="chip">📝 퀴즈 미응시</span>`;
  else if (S.quizState==='live') chip = `<span class="chip live">📝 퀴즈 진행 중</span>`;
  else chip = `<span class="chip done">✔ 퀴즈 완료 (${S.answers.filter(a=>a!==null).length}/${S.quizSet.length} 응답)</span>`;
  row.innerHTML = `<span class="chip live">⏱ 기록 측정 중</span>${chip}`;
  $('btnQuiz').disabled = S.quizState!=='none';
}

/* ================= Quiz ================= */
function shuffleArr(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function buildQuizSet(){
  let pool = questions.filter(q => q.q && q.o && q.o.filter(Boolean).length>=2);
  if (settings.shuffle) pool = shuffleArr(pool);
  pool = pool.slice(0, settings.quizCount);
  return pool.map(q => {
    const opts = q.o.map((t,i)=>({t, correct:i===q.a})).filter(x=>x.t!=='' && x.t!=null);
    const isOX = opts.length===2 && opts.every(x=>/^[OX]$/i.test(String(x.t).trim()));
    return {q:q.q, opts: (settings.shuffleOpts && !isOX) ? shuffleArr(opts) : opts, ox:isOX};
  });
}

function startQuiz(){
  if (S.quizState!=='none') return;
  const set = buildQuizSet();
  if (!set.length){ toast('등록된 문제가 없습니다. 관리자 설정에서 문제를 등록하세요.'); return; }
  if (!S.running) startMain();
  S.quizSet = set; S.quizIdx = 0; S.answers = new Array(set.length).fill(null);
  S.quizState = 'live';
  $('qTotal').textContent = set.length;
  $('quiz').classList.remove('hidden');
  renderQuestion();
  clearInterval(S.quizTimer);
  S.quizTimer = setInterval(qTick, 100);
  qTick();
  renderStatus();
}
function renderQuestion(){
  const q = S.quizSet[S.quizIdx];
  $('qNum').textContent = S.quizIdx+1;
  $('qText').textContent = q.q;
  $('qDots').innerHTML = S.quizSet.map((_,i)=>`<span class="${i===S.quizIdx?'cur':(S.answers[i]!==null?'ans':'')}"></span>`).join('');
  const box = $('qOpts');
  box.className = 'opts' + (q.ox ? ' ox' : '') + (q.opts.length===2 ? ' two':'');
  box.innerHTML = q.opts.map((o,i)=>`<button class="opt" onclick="choose(${i})"><span class="n">${i+1}</span><span>${escapeHtml(o.t)}</span></button>`).join('');
  S.qStart = performance.now(); S.lastHalf = null; S.moving = false; S.tickOn = false;
}
/* 문제당 제한 시간 */
function qTick(){
  if (S.quizState!=='live' || S.moving) return;
  const total = (settings.qSec||30)*1000;
  const left = total - (performance.now() - S.qStart);
  const sec = Math.ceil(Math.max(0,left)/1000);
  const ring = $('qRing');
  $('qSec').textContent = sec;
  $('qRingFg').style.strokeDashoffset = (653.45 * (1 - Math.max(0,left)/total)) + '';
  var cls = 'ring' + (sec<=5 ? ' danger' : sec<=10 ? ' warn' : '');
  if (left > 0 && left <= 10000){
    var half = Math.floor(left/500);
    if (half !== S.lastHalf){
      S.lastHalf = half;
      if (half % 2) SFX.tick(); else SFX.tock();
      if (half % 2){ ring.className = cls; void ring.offsetWidth; S.tickOn = true; }
    }
  }
  ring.className = cls + (S.tickOn ? ' tick' : '');
  if (left <= 0){ SFX.buzzer(); nextQuestion(true); }
}
function nextQuestion(timedOut){
  S.moving = true;
  $('qOpts').classList.add('locked');
  setTimeout(()=>{
    if (S.quizState!=='live') return;
    $('qOpts').classList.remove('locked');
    if (S.quizIdx < S.quizSet.length-1){ S.quizIdx++; renderQuestion(); qTick(); }
    else endQuiz('complete');
  }, timedOut ? 700 : 220);
}
function choose(i){
  if (S.quizState!=='live' || S.moving) return;
  S.answers[S.quizIdx] = i;
  const btns = $('qOpts').children;
  btns[i].classList.add('sel');
  btns[i].style.opacity = 1;
  nextQuestion(false);
}
function endQuiz(reason){
  if (S.quizState!=='live') return;
  S.quizState = 'done';
  clearInterval(S.quizTimer);
  $('qOpts').classList.add('locked');
  const answered = S.answers.filter(a=>a!==null).length;
  setTimeout(()=>{
    closeQuiz();
    renderStatus();
    toast(reason==='timeout'
      ? `⏰ 퀴즈 시간 종료 (${answered}/${S.quizSet.length} 응답) — 경기를 계속하세요`
      : `✔ 퀴즈 완료 — 경기를 계속하세요`);
  }, reason==='timeout' ? 600 : 150);
}
function closeQuiz(){ $('quiz').classList.add('hidden'); }
function score(){
  return S.quizSet.reduce((s,q,i)=> s + (S.answers[i]!==null && q.opts[S.answers[i]].correct ? 1 : 0), 0);
}

/* ================= Submit / Result ================= */
function askSubmit(){
  if (!S.running){ return; }
  if (S.quizState==='live'){
    showModal(`<h3>퀴즈 진행 중</h3><p>퀴즈를 모두 푼 뒤 최종 제출할 수 있습니다.</p><div class="btn-row"><button class="btn-big" onclick="hideModal()">확인</button></div>`);
    return;
  }
  if (!settings.confirmSubmit){ finalSubmit(); return; }
  const warn = S.quizState==='none' ? `<p style="color:var(--warn);margin-top:10px">⚠ 아직 퀴즈를 풀지 않았습니다. 퀴즈 점수는 0점 처리됩니다.</p>` : '';
  showModal(`<h3>최종 제출하시겠습니까?</h3><p>제출하면 타이머가 멈추고 기록이 확정됩니다.</p>${warn}
    <div class="btn-row"><button class="btn-big ghost" onclick="hideModal()">취소</button><button class="btn-big yellow" onclick="finalSubmit()">제출</button></div>`);
}
function finalSubmit(){
  stopMain();
  hideModal();
  clearInterval(S.quizTimer);
  $('quiz').classList.add('hidden');
  SFX.submit();
  const total = S.quizSet.length || settings.quizCount;
  const sc = S.quizSet.length ? score() : 0;
  const name = $('nameInput').value.trim();
  const dept = $('deptInput').value.trim();
  $('resName').textContent = name ? `${name} 님` : '경기 종료';
  $('resDept').textContent = dept;
  $('resTime').textContent = fmtStr(S.elapsed);
  $('resScore').innerHTML = `${sc}<small> / ${total}</small>`;
  $('resReview').innerHTML = S.quizSet.map((q,i)=>{
    const ok = S.answers[i]!==null && q.opts[S.answers[i]].correct;
    return `<div class="${ok?'o':'x'}">${i+1}번 ${ok?'O':'X'}</div>`;
  }).join('');
  $('resReview').classList.add('hidden');
  const rec = {id:'r'+Date.now(), name:name||'(이름 없음)', dept:dept, time:S.elapsed, score:sc, total:total, at:new Date().toLocaleString('ko-KR')};
  records.unshift(rec);
  LS.set('hc_records', records);
  $('scrMain').classList.add('hidden');
  $('scrResult').classList.remove('hidden');
  $('btnQuiz').style.visibility='hidden';
  showRanking(rec);
}

/* ================= Ranking animation ================= */
var ROWH = 63, RANK_MAX = 10, rankTimers = [];
function rowHtml(r, rank, me){
  return `<span class="c-rank">${rank}</span><span class="c-name">${escapeHtml(r.name)}${me?' ⭐':''}</span>`+
         `<span class="c-dept">${escapeHtml(r.dept||'-')}</span><span class="c-score">${r.score}/${r.total}</span>`+
         `<span class="c-time mono">${fmtStr(r.time)}</span>`;
}
function medal(el, rank){ el.classList.remove('g1','g2','g3'); if(rank<=3) el.classList.add('g'+rank); }
function placeRow(el, slot, rank){
  el.style.top = (slot*ROWH)+'px';
  if (rank!=null){ el.querySelector('.c-rank').textContent = rank; medal(el, rank); }
}
function clearRankTimers(){ rankTimers.forEach(clearTimeout); rankTimers = []; }
function later(fn, ms){ rankTimers.push(setTimeout(fn, ms)); }
function showRanking(rec){
  clearRankTimers();
  const board = $('board'); board.innerHTML = '';
  const all = sortRecords(records);
  const finalIdx = all.indexOf(rec);
  const prior = all.filter(r=>r!==rec);
  $('rankTotal').textContent = `총 ${all.length}명 참가`;
  const msg = $('rankMsg'); msg.classList.remove('show'); msg.textContent='';

  const make = (r, slot, rank, me) => {
    const el = document.createElement('div');
    el.className = 'rrow' + (me?' me':'');
    el.innerHTML = rowHtml(r, rank, me);
    placeRow(el, slot, rank);
    board.appendChild(el);
    return el;
  };

  const inTop = finalIdx < RANK_MAX;
  const visiblePrior = inTop ? Math.min(prior.length, RANK_MAX-1) : RANK_MAX-1;
  const rows = [];
  for (let i=0;i<visiblePrior;i++) rows.push(make(prior[i], i, i+1, false));
  let meSlot, meEl, startRank = prior.length+1;
  if (inTop){
    meSlot = visiblePrior;
  } else {
    const g = make({name:'',dept:'',score:'',total:'',time:0}, RANK_MAX-1, null, false);
    g.className='rrow gap'; g.innerHTML='• • •';
    meSlot = RANK_MAX;
  }
  meEl = make(rec, meSlot, startRank, true);
  meEl.style.opacity = 0;
  later(()=>{ meEl.style.opacity = 1; SFX.whoosh(); }, 350);

  const finish = () => {
    meEl.classList.remove('moving');
    meEl.classList.add('landed');
    const rank = finalIdx+1;
    SFX.fanfare(rank===1);
    msg.textContent = rank===1 ? '🏆 축하합니다! 현재 1위입니다!' : rank<=3 ? `🎉 현재 ${rank}위! 상위권 진입!` : `현재 ${rank}위 / 총 ${all.length}명`;
    msg.classList.add('show');
  };

  if (inTop){
    const steps = meSlot - finalIdx;
    if (steps<=0){ later(finish, 900); return; }
    const gap = Math.max(200, Math.min(480, 3200/steps));
    let cur = meSlot, n = 0;
    const step = () => {
      cur--; n++;
      const pushed = rows[cur];            // row currently at slot cur moves down
      placeRow(pushed, cur+1, cur+2);
      rows[cur+1] = pushed; rows[cur] = meEl;
      meEl.classList.remove('moving'); void meEl.offsetWidth; meEl.classList.add('moving');
      placeRow(meEl, cur, cur+1);
      SFX.swap(n);
      if (cur > finalIdx) later(step, gap); else later(finish, 450);
    };
    later(step, 1100);
  } else {
    // 순위권 밖: 순위 숫자만 카운트다운
    const target = finalIdx+1;
    const steps = Math.max(0, startRank - target);
    const count = Math.min(steps, 18);
    let n = 0;
    const step = () => {
      n++;
      const r = Math.round(startRank - steps*(n/count));
      meEl.querySelector('.c-rank').textContent = r;
      meEl.classList.remove('moving'); void meEl.offsetWidth; meEl.classList.add('moving');
      SFX.swap(n);
      if (n < count) later(step, 160); else later(finish, 400);
    };
    if (count>0) later(step, 1100); else later(finish, 900);
  }
}
function toggleReview(){ $('resReview').classList.toggle('hidden'); }
function resetAll(){
  clearRankTimers();
  stopMain();
  clearInterval(S.quizTimer);

/* ================= Modal / toast ================= */
function showModal(html){ $('modalBox').innerHTML = html; $('modal').classList.remove('hidden'); }
function hideModal(){ $('modal').classList.add('hidden'); }
function toast(msg){
  const t = document.createElement('div'); t.className='toast'; t.textContent=msg;
  $('stage').appendChild(t); setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 2600);
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ================= Fullscreen / wake lock ================= */
function toggleFS(){
  var d=document, el=d.documentElement;
  var fs = d.fullscreenElement||d.webkitFullscreenElement;
  try{
    if(!fs){ var r=el.requestFullscreen||el.webkitRequestFullscreen; if(r){ var pr=r.call(el); if(pr&&pr.catch)pr.catch(function(){}); } }
    else { var x=d.exitFullscreen||d.webkitExitFullscreen; if(x)x.call(d); }
  }catch(e){}
  setTimeout(fitStage,300);
}
let wakeLock = null;
function requestWakeLock(){ try{ if(navigator.wakeLock){ navigator.wakeLock.request('screen').then(function(w){wakeLock=w;}).catch(function(){}); } }catch(e){} }

function qItemHtml(q,i){

}

function addQ(){ draft.push({q:'',o:['','','',''],a:0}); renderQAdmin(); $('adminBody').scrollTop = 1e9; }
function delQ(i){ draft.splice(i,1); renderQAdmin(); }
function moveQ(i,d){ const j=i+d; if(j<0||j>=draft.length)return; [draft[i],draft[j]]=[draft[j],draft[i]]; renderQAdmin(); }
function resetQ(){ draft = JSON.parse(JSON.stringify(DEFAULT_QUESTIONS)); renderQAdmin(); toast('예시 문제로 바뀌었습니다. 저장을 눌러 적용하세요.'); }
function saveQ(){
  const clean = draft.map(q=>({q:(q.q||'').trim(), o:[0,1,2,3].map(k=>(q.o[k]==null?'':q.o[k]).toString().trim()), a:q.a|0}));
  const bad = clean.findIndex(q=> !q.q || q.o.filter(Boolean).length<2 || !q.o[q.a]);
  if (bad>=0){ toast(`${bad+1}번 문제를 확인하세요 (문제·보기 2개 이상·정답 보기 필요)`); return; }

/* ---- file import/export ---- */
function rowsToQuestions(rows){
  // rows: array of arrays; first row may be header
  const out = [];
  rows.forEach((r,idx)=>{
    if (!r || !r.length) return;
    const cells = r.map(c=> c==null ? '' : String(c).trim());
    if (idx===0 && /문제|question/i.test(cells[0])) return;
    if (!cells[0]) return;
    const o = [cells[1]||'',cells[2]||'',cells[3]||'',cells[4]||''];
    let ans = cells[5]||'';
    let a = -1;
    if (/^[1-4]$/.test(ans)) a = +ans-1;
    else {
      a = o.findIndex(x=>x && x.toLowerCase()===ans.toLowerCase());
      if (a<0 && /^[①②③④]$/.test(ans)) a = '①②③④'.indexOf(ans);
    }
    if (a<0) a = 0;
    out.push({q:cells[0], o, a});
  });
  return out;
}
function parseCSV(text){
  const rows=[]; let row=[], cur='', q=false;
  for (let i=0;i<text.length;i++){
    const ch=text[i];
    if (q){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else if (ch==='"') q=true;
    else if (ch===','){ row.push(cur); cur=''; }
    else if (ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n')i++; row.push(cur); rows.push(row); row=[]; cur=''; }
    else cur+=ch;
  }
  if (cur||row.length){ row.push(cur); rows.push(row); }
  return rows;
}
function onFile(e){
  const f = e.target.files[0]; e.target.value='';
  if (!f) return;
  const name = f.name.toLowerCase();
  const reader = new FileReader();
  const done = qs => {
    if (!qs.length){ toast('불러온 문제가 없습니다. 양식을 확인하세요.'); return; }
    draft = qs; renderQAdmin();
    toast(`📤 ${qs.length}문항을 불러왔습니다. 확인 후 [저장]을 누르세요.`);
  };
  if (name.endsWith('.json')){
    reader.onload = () => {
      try{
        const d = JSON.parse(reader.result);
        const arr = Array.isArray(d) ? d : d.questions;
        done(arr.map(x=>{
          if (Array.isArray(x)) return rowsToQuestions([x])[0];
          const o = x.o || x.options || [x['보기1'],x['보기2'],x['보기3'],x['보기4']];
          let a = x.a!=null ? x.a : (x.answer!=null ? x.answer : x['정답']);
          if (typeof a==='string' && /^[1-4]$/.test(a)) a = +a-1;
          else if (typeof a==='number' && !('a' in x)) a = a-1;
          return {q:x.q||x.question||x['문제'], o:[0,1,2,3].map(k=>(o[k]==null?'':o[k])), a:a|0};
        }).filter(q=>q && q.q));
      }catch(err){ toast('JSON 형식 오류'); }
    };
    reader.readAsText(f, 'utf-8');
  } else if (name.endsWith('.csv')){
    reader.onload = () => { let t = reader.result.replace(/^﻿/,''); done(rowsToQuestions(parseCSV(t))); };
    reader.readAsText(f, 'utf-8');
  } else {
    if (typeof XLSX==='undefined'){ toast('엑셀 라이브러리를 불러오지 못했습니다. CSV로 업로드해 주세요.'); return; }
    reader.onload = () => {
      const wb = XLSX.read(new Uint8Array(reader.result), {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      done(rowsToQuestions(XLSX.utils.sheet_to_json(ws, {header:1, defval:''})));
    };
    reader.readAsArrayBuffer(f);
  }
}
function questionsToRows(qs){
  return [['문제','보기1','보기2','보기3','보기4','정답(번호)'], ...qs.map(q=>[q.q, q.o[0]||'', q.o[1]||'', q.o[2]||'', q.o[3]||'', (q.a|0)+1])];
}
function downloadRows(rows, filename){
  if (typeof XLSX!=='undefined'){
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = [{wch:60},{wch:18},{wch:18},{wch:18},{wch:18},{wch:12}];
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, '문제');
    XLSX.writeFile(wb, filename + '.xlsx');
  } else {
    const csv = '﻿' + rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download = filename + '.csv'; a.click();
  }
}
function downloadTemplate(){
  downloadRows(questionsToRows([
    {q:'(예시) 4지선다 문제를 입력하세요', o:['보기 A','보기 B','보기 C','보기 D'], a:1},
    {q:'(예시) O/X 문제를 입력하세요', o:['O','X','',''], a:0},
    ...DEFAULT_QUESTIONS.slice(0,3)
  ]), '경진대회_퀴즈_양식');
}
function exportQuestions(){ downloadRows(questionsToRows(draft), '경진대회_퀴즈_문제'); }

function exportRecords(){
  const sorted = [...records].sort((a,b)=> b.score-a.score || a.time-b.time);

/* ================= Stage scaling ================= */
function fitStage(){
  var W = window.innerWidth || document.documentElement.clientWidth;
  var H = window.innerHeight || document.documentElement.clientHeight;
  var k = Math.min(W/1920, H/1080);
  var x = (W - 1920*k)/2, y = (H - 1080*k)/2;
  var st = $('stage');
  var tf = 'translate('+x+'px,'+y+'px) scale('+k+')';
  st.style.webkitTransform = tf; st.style.transform = tf;
}
window.addEventListener('resize', fitStage);
window.addEventListener('orientationchange', function(){ setTimeout(fitStage,300); });
document.addEventListener('fullscreenchange', fitStage);
document.addEventListener('webkitfullscreenchange', fitStage);
fitStage();

/* ================= Init ================= */
applyTexts();
updateSoundBtn();
renderStatus();
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && S.running) requestWakeLock(); });
window.addEventListener('beforeunload', e=>{ if(S.running){ e.preventDefault(); e.returnValue=''; } });
